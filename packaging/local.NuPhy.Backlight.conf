<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="local.NuPhy.Backlight"/>
  </policy>
  <policy context="default">
    <!-- Mutating methods additionally require root or the active seat0 user. -->
    <allow send_destination="local.NuPhy.Backlight"/>
  </policy>
</busconfig>
